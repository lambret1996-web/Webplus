name: 手动 iOS 语法与代码规范检查

on:
  workflow_dispatch:
    inputs:
      branch_to_check:
        description: '要检查的分支名称（可选）'
        required: false
        default: 'main'

jobs:
  check-code-quality:
    name: 编译与 SwiftLint 检查
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch_to_check || 'main' }}

      # 2. 创建日志目录
      - name: 创建日志目录
        run: mkdir -p error-logs

      # 3. 设置 Xcode 环境
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 4. 编译检查（输出到控制台 + 保存为 txt）
      - name: 编译项目（语法检查）
        run: |
          # 自动查找 .xcworkspace 或 .xcodeproj
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            PROJ="*.xcworkspace"
            SCHEME_ARG="-workspace"
          else
            PROJ="*.xcodeproj"
            SCHEME_ARG="-project"
          fi

          # 获取第一个 Scheme
          SCHEME=$(xcodebuild -list | grep "Schemes:" -A 100 | sed -n '2p' | xargs)

          echo "🚀 开始编译检查: $PROJ -> $SCHEME"

          # 执行编译并将输出保存到 txt 文件，同时打印到控制台
          set +e # 允许命令失败继续执行后续步骤
          xcodebuild clean build $SCHEME_ARG "$PROJ" -scheme "$SCHEME" -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' | tee error-logs/编译日志.txt
          BUILD_EXIT_CODE=$?
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::❌ 编译失败！请查看 '编译日志.txt'"
            exit 1
          else
            echo "✅ 编译成功"
          fi

      # 5. SwiftLint 检查（输出到控制台 + 保存为 txt）
      - name: 运行 SwiftLint（仅拦截错误）
        run: |
          if ! command -v swiftlint &> /dev/null; then
            echo "⚠️ 未检测到 SwiftLint，正在安装..."
            brew install swiftlint
          fi

          echo "🔍 开始代码规范检查..."

          # 执行 SwiftLint 并将输出保存到 txt 文件，同时打印到控制台
          set +e
          swiftlint lint --quiet | tee error-logs/代码规范检查.txt
          LINT_EXIT_CODE=$?
          set -e

          if [ $LINT_EXIT_CODE -ne 0 ]; then
            echo "::error::❌ SwiftLint 检查发现违规！请查看 '代码规范检查.txt'"
            # 注意：这里不退出脚本，因为我们只想报告问题，不想阻断流程（除非你希望阻断）
            # 如果你希望发现规范问题就报错停止，请取消下面注释：
            # exit 1
          else
            echo "✅ 代码规范检查通过"
          fi

      # 6. 打包并上传日志（合并为一个 zip）
      - name: 打包错误日志
        if: always()
        run: |
          cd error-logs
          # 将两个 txt 文件打包成一个 zip
          zip -r ../iOS_Code_Check_Logs.zip *.txt
          cd ..

      - name: 上传日志压缩包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Check-Logs
          path: iOS_Code_Check_Logs.zip
          retention-days: 7
