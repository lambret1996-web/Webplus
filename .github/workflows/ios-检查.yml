name: 手动 iOS 语法与代码规范检查

on:
  workflow_dispatch:
    inputs:
      branch_to_check:
        description: '要检查的分支名称（可选）'
        required: false
        default: 'main'

jobs:
  check-code-quality:
    name: 编译与 SwiftLint 检查
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_to_check || 'main' }}

      # 2. 创建日志目录
      - name: 创建日志目录
        run: mkdir -p error-logs

      # 3. 设置 Xcode 环境
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 4. 编译检查（输出到控制台 + 保存为 txt）
      - name: 编译项目（语法检查）
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            PROJ="*.xcworkspace"
            SCHEME_ARG="-workspace"
          elif ls *.xcodeproj 1> /dev/null 2>&1; then
            PROJ="*.xcodeproj"
            SCHEME_ARG="-project"
          else
            echo "错误：未找到 Xcode 工程文件或工作区文件！"
            exit 1
          fi

          echo "正在编译 $PROJ..."

          # tee 让输出同时显示在控制台并保存到 txt 文件
          xcodebuild clean build \
            $SCHEME_ARG $PROJ \
            -scheme "WebViewBrowser" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee error-logs/编译日志.txt | xcpretty || exit 1

      # 5. 安装 SwiftLint
      - name: 安装 SwiftLint
        run: brew install swiftlint

      # 6. SwiftLint 检查（输出到控制台 + 保存为 txt）
      - name: 运行 SwiftLint（仅拦截错误）
        run: |
          swiftlint lint --quiet 2>&1 | tee error-logs/代码规范检查.txt
          exit ${PIPESTATUS[0]}

      # 7. 上传编译日志（单独文件）
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: error-logs/编译日志.txt
          retention-days: 30

      # 8. 上传代码规范检查日志（单独文件）
      - name: 上传代码规范检查日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 代码规范检查日志
          path: error-logs/代码规范检查.txt
          retention-days: 30
