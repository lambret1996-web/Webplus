name: 手动 iOS 语法与代码规范检查

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch_to_check:
        description: '要检查的分支名称（可选）'
        required: false
        default: 'main'

jobs:
  check-code-quality:
    name: 编译与 SwiftLint 检查
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch_to_check || 'main' }}

      # 2. 创建日志目录
      - name: 创建日志目录
        run: mkdir -p error-logs

      # 3. 设置 Xcode 环境
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 4. 编译检查（真机架构，语法+架构验证一次完成）
      - name: 编译项目（真机架构语法检查）
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            PROJ="*.xcworkspace"
            SCHEME_ARG="-workspace"
          elif ls *.xcodeproj 1> /dev/null 2>&1; then
            PROJ="*.xcodeproj"
            SCHEME_ARG="-project"
          else
            echo "错误：未找到 Xcode 工程文件！"
            exit 1
          fi
          echo "正在编译（真机arm64）..."
          xcodebuild clean build \
            $SCHEME_ARG $PROJ \
            -scheme "WebViewBrowser" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit 1
      - name: 编译项目-真机（架构验证）
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            PROJ="*.xcworkspace"
            SCHEME_ARG="-workspace"
          elif ls *.xcodeproj 1> /dev/null 2>&1; then
            PROJ="*.xcodeproj"
            SCHEME_ARG="-project"
          else
            echo "错误：未找到 Xcode 工程文件！"
            exit 1
          fi
          echo "正在编译（真机arm64）..."
          xcodebuild build \
            $SCHEME_ARG $PROJ \
            -scheme "WebViewBrowser" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit 1

      - name: 安装 SwiftLint
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install swiftlint

      - name: 运行 SwiftLint（代码风格提示，不中断构建）
        continue-on-error: true
        run: |
          swiftlint lint --config .swiftlint.yml --quiet || echo "SwiftLint 发现代码风格问题，但不影响构建"

