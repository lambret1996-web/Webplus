name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  APP_NAME: WebViewBrowser
  SCHEME: WebViewBrowser
  BUILD_CONFIG: Release

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set build configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_CONFIG=${{ github.event.inputs.configuration }}" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=Release" >> $GITHUB_ENV
          fi
          echo "Build configuration: $BUILD_CONFIG"

      - name: 缓存Xcode构建产物
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('WebViewBrowser.xcodeproj/**/*.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show project info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true
          echo "---"
          xcodebuild -list -project "${APP_NAME}.xcodeproj"

      - name: 自动递增版本号
        run: |
          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" WebViewBrowser/Info.plist)
          echo "当前版本: $CURRENT_VERSION"
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          echo "新版本: $NEW_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" WebViewBrowser/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_VERSION" WebViewBrowser/Info.plist
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "版本号已自动递增到 $NEW_VERSION"

      # ============================================================
      # 无签名构建（TrollStore 安装用）
      # ============================================================
      - name: Build (Unsigned)
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA (Unsigned)
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          # Ad-hoc 签名（TrollStore 需要）
          codesign --force --sign - --generate-entitlement-der "$APP_PATH" 2>&1 || true
          # 打包 IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lah "${APP_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      - name: IPA体积分析
        run: |
          echo "=== IPA 体积分析 ==="
          IPA_SIZE=$(du -sh "${{ env.APP_NAME }}.ipa" | cut -f1)
          echo "IPA 总大小: $IPA_SIZE"
          rm -rf ipa_analysis
          mkdir ipa_analysis
          unzip -q "${{ env.APP_NAME }}.ipa" -d ipa_analysis
          echo "--- App 包内容（前15大） ---"
          du -sh ipa_analysis/Payload/*.app/* 2>/dev/null | sort -rh | head -15
          rm -rf ipa_analysis

      - name: 自动发布Release（仅tag或手动触发）
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 轻量浏览器 v${{ env.VERSION }}
          body: |
            ## 轻量浏览器 v${{ env.VERSION }}
            
            ### 构建信息
            - 提交: ${{ github.sha }}
            
            ### 安装说明
            1. 下载下方 IPA 文件
            2. 使用 TrollStore 安装（免签名）
            
            ### 注意
            - 本版本为未签名 IPA，仅支持 TrollStore 安装
            - 具体更新内容请查看 commit 记录
          files: |
            ${{ env.APP_NAME }}.ipa
