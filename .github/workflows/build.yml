name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  APP_NAME: WebViewBrowser
  SCHEME: WebViewBrowser
  BUILD_CONFIG: Release
  TEAM_ID: FTL7Y6J897

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set build configuration

      - name: 缓存Xcode构建产物
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('WebViewBrowser.xcodeproj/**/*.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_CONFIG=${{ github.event.inputs.configuration }}" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=Release" >> $GITHUB_ENV
          fi
          echo "Build configuration: $BUILD_CONFIG"

      - name: Detect signing certificate
        id: detect
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "has_cert=true" >> $GITHUB_OUTPUT
            echo "检测到签名证书，将使用签名模式构建"
          else
            echo "has_cert=false" >> $GITHUB_OUTPUT
            echo "未检测到签名证书，将使用无签名模式构建"
          fi

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Show project info
        run: |
          xcodebuild -list -project "${APP_NAME}.xcodeproj"

      # ============================================================
      # 无签名构建（默认，无需证书）
      # ============================================================
      - name: Build (Unsigned)
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \

      - name: 自动递增版本号
        run: |
          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" WebViewBrowser/Info.plist)
          echo "当前版本: $CURRENT_VERSION"
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          echo "新版本: $NEW_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" WebViewBrowser/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_VERSION" WebViewBrowser/Info.plist
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "版本号已自动递增到 $NEW_VERSION"

            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA (Unsigned)
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          chmod +x "$APP_PATH/${APP_NAME}"
          codesign --force --sign - --generate-entitlement-der "$APP_PATH" 2>&1 || true
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${APP_NAME}.ipa"

      # ============================================================
      # 签名构建（使用企业证书）
      # ============================================================
      - name: Install Apple certificate
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          # 使用printf避免echo添加换行符
          printf "%s" "$IOS_CERTIFICATE" | base64 -d > certificate.p12
          echo "证书文件大小: $(stat -f%z certificate.p12) bytes"
          # 使用openssl转换p12为pem，然后导入
          openssl pkcs12 -in certificate.p12 -out certificate.pem -nodes -passin pass:"$IOS_CERTIFICATE_PWD" 2>/dev/null
          if [ -f certificate.pem ] && [ -s certificate.pem ]; then
            echo "openssl转换成功，导入证书和私钥"
            security import certificate.pem -k build.keychain -T /usr/bin/codesign || echo "pem导入警告"
          else
            echo "openssl转换失败，尝试直接导入p12"
            security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PWD" -T /usr/bin/codesign || echo "p12导入警告"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "=== 可用签名身份 ==="
          security find-identity -v -p codesigning build.keychain || true
          rm -f certificate.p12 certificate.pem
          echo "证书安装完成"

      - name: Install provisioning profile
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # 使用printf避免echo添加换行符
          printf "%s" "$IOS_PROVISION_PROFILE" | base64 -d > profile.mobileprovision
          echo "描述文件大小: $(stat -f%z profile.mobileprovision) bytes"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision
          echo "Provisioning profile UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${{ env.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.silver9175.tomato8924</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Build Extension (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          # 先构建Extension target（不签名，后续统一签名）
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -target AppProxyExtension \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "Extension构建完成"
          find build -name "*.appex" -type d 2>/dev/null | head -5 || true

      - name: Archive (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            CODE_SIGN_IDENTITY="iPhone Distribution"
          
          # 保存Extension路径，后续手动添加到IPA
          EXTENSION_PATH=$(find build -name "AppProxyExtension.appex" -type d 2>/dev/null | head -1)
          echo "Extension构建路径: $EXTENSION_PATH"
          if [ -n "$EXTENSION_PATH" ]; then
            cp -R "$EXTENSION_PATH" build/AppProxyExtension.appex
            echo "Extension已保存到build/AppProxyExtension.appex"
          fi

      - name: Export IPA (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
          ls -lh build/export/
          
          # 手动将Extension添加到IPA中（终极ldid签名方案，适配TrollStore）
          if [ -d "build/AppProxyExtension.appex" ]; then
            echo "=== 开始Extension终极签名（TrollStore专用）==="
            # 安装ldid
            export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
            brew install ldid 2>/dev/null || true
            # 清理旧签名
            rm -rf build/AppProxyExtension.appex/_CodeSignature
            rm -f build/AppProxyExtension.appex/embedded.mobileprovision
            # 复制entitlements
            cp AppProxyExtension/AppProxyExtension.entitlements build/AppProxyExtension.appex/entitlements.plist
            # 步骤1：用ldid给二进制注入entitlements（关键！）
            if command -v ldid &> /dev/null; then
              echo "[1/3] ldid注入entitlements到二进制..."
              ldid -Sbuild/AppProxyExtension.appex/entitlements.plist build/AppProxyExtension.appex/AppProxyExtension
              echo "ldid签名完成"
            else
              echo "[1/3] ldid未安装，跳过"
            fi
            # 步骤2：用codesign ad-hoc签名整个包
            echo "[2/3] codesign ad-hoc签名整个.appex..."
            codesign --force --sign - --entitlements build/AppProxyExtension.appex/entitlements.plist --generate-entitlement-der --timestamp=none build/AppProxyExtension.appex 2>&1 || echo "codesign签名警告"
            # 步骤3：验证
            echo "[3/3] 验证签名..."
            codesign -d --entitlements - build/AppProxyExtension.appex 2>&1 | head -25 || true
            rm -f build/AppProxyExtension.appex/entitlements.plist
            echo "=== Extension终极签名完成 ==="
            
            echo "将Extension添加到IPA中..."
            cd build/export
            unzip -q ${APP_NAME}.ipa -d ipa_temp
            mkdir -p ipa_temp/Payload/${APP_NAME}.app/PlugIns
            cp -R ../AppProxyExtension.appex ipa_temp/Payload/${APP_NAME}.app/PlugIns/
            cd ipa_temp
            zip -qr ../${APP_NAME}.ipa Payload
            cd ..
            rm -rf ipa_temp
            echo "Extension已添加到IPA"
            cd ../..
          fi
          
          cp build/export/${APP_NAME}.ipa ./${APP_NAME}.ipa
          ls -lh ${APP_NAME}.ipa

      # ============================================================
      # 上传产物
      # ============================================================
      - name: Upload IPA
        if: steps.detect.outputs.has_cert == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      - name: Upload signed IPA
        if: steps.detect.outputs.has_cert == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-signed-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      - name: IPA体积分析
        run: |
          echo "=== IPA 体积分析 ==="
          IPA_SIZE=$(du -sh "${{ env.APP_NAME }}.ipa" | cut -f1)
          echo "IPA 总大小: $IPA_SIZE"
          rm -rf ipa_analysis
          mkdir ipa_analysis
          unzip -q "${{ env.APP_NAME }}.ipa" -d ipa_analysis
          echo "--- App 包内容（前15大） ---"
          du -sh ipa_analysis/Payload/*.app/* 2>/dev/null | sort -rh | head -15
          rm -rf ipa_analysis

      - name: 自动发布Release（仅tag或手动触发）
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Webplus v${{ env.VERSION }}
          body: |
            ## Webplus v${{ env.VERSION }}
            ### 构建信息
            - 提交: ${{ github.sha }}
            ### 安装说明
            1. 下载下方 IPA 文件
            2. 使用 TrollStore 或爱思助手安装
          files: |
            ${{ env.APP_NAME }}.ipa
