name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  APP_NAME: WebViewBrowser
  SCHEME: WebViewBrowser
  BUILD_CONFIG: Release

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_CONFIG=${{ github.event.inputs.configuration }}" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=Release" >> $GITHUB_ENV
          fi
          echo "Build configuration: $BUILD_CONFIG"

      - name: Detect signing certificate
        id: detect
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "has_cert=true" >> $GITHUB_OUTPUT
            echo "检测到签名证书，将使用签名模式构建"
          else
            echo "has_cert=false" >> $GITHUB_OUTPUT
            echo "未检测到签名证书，将使用无签名模式构建"
          fi

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Show project info
        run: |
          xcodebuild -list -project "${APP_NAME}.xcodeproj"

      # ============================================================
      # 无签名构建 + 手动 ad-hoc 签名（默认，无需证书）
      # ============================================================
      - name: Build (Unsigned)
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          # 确保二进制文件有执行权限
          chmod +x "$APP_PATH/${APP_NAME}"
          # 手动 ad-hoc 签名（绕过 xcodebuild 的 SDK 限制，生成 _CodeSignature 结构）
          codesign --force --sign - --generate-entitlement-der "$APP_PATH" 2>&1 || true
          # 验证签名和结构
          echo "=== App 内容 ==="
          ls -la "$APP_PATH/"
          echo "=== _CodeSignature ==="
          ls -la "$APP_PATH/_CodeSignature/" 2>/dev/null || echo "无 _CodeSignature"
          echo "=== 二进制信息 ==="
          file "$APP_PATH/${APP_NAME}"
          # 打包 IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${APP_NAME}.ipa"

      # ============================================================
      # 签名构建（需配置 GitHub Secrets）
      # ============================================================
      - name: Install Apple certificate
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          echo "$IOS_CERTIFICATE" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: Install provisioning profile
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision
          echo "Provisioning profile UUID: $UUID"

      - name: Build (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            clean build

      - name: Export signed IPA
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/${APP_NAME}.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${APP_NAME}.ipa"

      # ============================================================
      # 上传产物
      # ============================================================
      - name: Upload IPA
        if: steps.detect.outputs.has_cert == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      - name: Upload signed IPA
        if: steps.detect.outputs.has_cert == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90
