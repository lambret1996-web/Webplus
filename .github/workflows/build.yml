name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  APP_NAME: WebViewBrowser
  SCHEME: WebViewBrowser
  BUILD_CONFIG: Release
  TEAM_ID: FTL7Y6J897

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_CONFIG=${{ github.event.inputs.configuration }}" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=Release" >> $GITHUB_ENV
          fi
          echo "Build configuration: $BUILD_CONFIG"

      - name: Detect signing certificate
        id: detect
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "has_cert=true" >> $GITHUB_OUTPUT
            echo "检测到签名证书，将使用签名模式构建"
          else
            echo "has_cert=false" >> $GITHUB_OUTPUT
            echo "未检测到签名证书，将使用无签名模式构建"
          fi

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Show project info
        run: |
          xcodebuild -list -project "${APP_NAME}.xcodeproj"

      # ============================================================
      # 无签名构建（默认，无需证书）
      # ============================================================
      - name: Build (Unsigned)
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA (Unsigned)
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          chmod +x "$APP_PATH/${APP_NAME}"
          codesign --force --sign - --generate-entitlement-der "$APP_PATH" 2>&1 || true
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${APP_NAME}.ipa"

      # ============================================================
      # 签名构建（使用企业证书）
      # ============================================================
      - name: Install Apple certificate
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          # 使用printf避免echo添加换行符
          printf "%s" "$IOS_CERTIFICATE" | base64 -d > certificate.p12
          echo "证书文件大小: $(stat -f%z certificate.p12) bytes"
          # 使用openssl转换p12为pem，然后导入
          openssl pkcs12 -in certificate.p12 -out certificate.pem -nodes -passin pass:"$IOS_CERTIFICATE_PWD" 2>/dev/null
          if [ -f certificate.pem ] && [ -s certificate.pem ]; then
            echo "openssl转换成功，导入证书和私钥"
            security import certificate.pem -k build.keychain -T /usr/bin/codesign || echo "pem导入警告"
          else
            echo "openssl转换失败，尝试直接导入p12"
            security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PWD" -T /usr/bin/codesign || echo "p12导入警告"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "=== 可用签名身份 ==="
          security find-identity -v -p codesigning build.keychain || true
          rm -f certificate.p12 certificate.pem
          echo "证书安装完成"

      - name: Install provisioning profile
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # 使用printf避免echo添加换行符
          printf "%s" "$IOS_PROVISION_PROFILE" | base64 -d > profile.mobileprovision
          echo "描述文件大小: $(stat -f%z profile.mobileprovision) bytes"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision
          echo "Provisioning profile UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${{ env.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.silver9175.tomato8924</key>
                  <string>${{ env.PROFILE_UUID }}</string>
                  <key>app.silver9175.tomato8924.AppProxyExtension</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Build Extension (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          # 先构建Extension target（不签名，后续统一签名）
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -target AppProxyExtension \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "Extension构建完成"
          find build -name "*.appex" -type d 2>/dev/null | head -5 || true

      - name: Archive (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            CODE_SIGN_IDENTITY="iPhone Distribution"
          
          # 手动将Extension复制到App的PlugIns目录
          APP_PATH="build/App.xcarchive/Products/Applications/${APP_NAME}.app"
          PLUGINS_DIR="${APP_PATH}/PlugIns"
          mkdir -p "${PLUGINS_DIR}"
          
          # 查找构建好的Extension（在build目录和DerivedData中搜索）
          EXTENSION_PATH=$(find build ~/Library/Developer/Xcode/DerivedData -name "AppProxyExtension.appex" -type d 2>/dev/null | head -1)
          echo "查找Extension路径: $EXTENSION_PATH"
          echo "build目录内容:"
          find build -name "*.appex" -type d 2>/dev/null || true
          if [ -n "$EXTENSION_PATH" ] && [ -d "$EXTENSION_PATH" ]; then
            echo "找到Extension: $EXTENSION_PATH"
            cp -R "$EXTENSION_PATH" "${PLUGINS_DIR}/"
            echo "Extension已复制到PlugIns目录"
            ls -la "${PLUGINS_DIR}/"
          else
            echo "警告: 未找到Extension，跳过复制"
          fi

      - name: Export IPA (Signed)
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          # 在导出前，删除Extension的签名文件，避免描述文件不匹配
          APP_PATH="build/App.xcarchive/Products/Applications/${APP_NAME}.app"
          EXTENSION_PATH="${APP_PATH}/PlugIns/AppProxyExtension.appex"
          if [ -d "$EXTENSION_PATH" ]; then
            echo "清理Extension签名..."
            rm -rf "${EXTENSION_PATH}/_CodeSignature"
            rm -f "${EXTENSION_PATH}/embedded.mobileprovision"
            echo "Extension签名已清理"
          fi
          
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
          ls -lh build/export/
          cp build/export/${APP_NAME}.ipa ./${APP_NAME}.ipa
          ls -lh ${APP_NAME}.ipa

      # ============================================================
      # 上传产物
      # ============================================================
      - name: Upload IPA
        if: steps.detect.outputs.has_cert == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      - name: Upload signed IPA
        if: steps.detect.outputs.has_cert == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90
